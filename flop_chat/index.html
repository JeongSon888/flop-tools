<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLOP Chat</title>
<style>
  :root { --bg:#0b1020; --panel:#121a33; --line:#24305a; --ink:#eef2ff; --muted:#93a0c4; --me:#2b5cff; --ai:#1b2547; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .app { max-width:820px; height:100%; margin:0 auto; display:flex; flex-direction:column; padding:0 16px; }
  header { padding:16px 0 10px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; }
  #status { color:var(--muted); font-size:13px; margin-top:4px; }
  #log { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .ai { align-self:flex-start; background:var(--ai); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .meta { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
  .err { align-self:center; color:var(--err); font-size:13px; }
  .empty { color:var(--muted); text-align:center; margin:auto; }
  form { display:flex; gap:8px; padding:12px 0 18px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:52px; padding:12px; border-radius:12px; border:1px solid var(--line);
             background:var(--panel); color:var(--ink); font:inherit; }
  button { padding:0 20px; border:0; border-radius:12px; background:var(--me); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>FLOP Chat</h1>
    <div id="status">Đang kiểm tra kết nối…</div>
  </header>
  <div id="log"><div class="empty" id="empty">Hỏi bất cứ điều gì. Câu trả lời do mô hình AI trên mạng FLOP (devnet) tạo ra.</div></div>
  <form id="f">
    <textarea id="q" placeholder="Nhập câu hỏi… (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
    <button id="send">Gửi</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const history = [];

function add(cls, text, meta) {
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (meta) { const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

async function info() {
  try {
    const r = await (await fetch("/api/info")).json();
    $("status").textContent = r.ready
      ? `Mô hình: ${r.model} · gateway ${r.gateway || "api.flop.network"}` + (r.expiresAt ? ` · khóa hết hạn ${new Date(r.expiresAt).toLocaleString("vi-VN")}` : "")
      : "Chưa có khóa gateway. Xem README để lấy khóa, rồi tải lại trang.";
  } catch { $("status").textContent = "Không kết nối được server cục bộ."; }
}

$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); }
});

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("q").value = ""; $("send").disabled = true;
  add("me", q);
  history.push({ role: "user", content: q });
  const wait = add("ai", "Đang hỏi mạng FLOP…");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
                                         body: JSON.stringify({ messages: history }) });
    const d = await r.json();
    wait.remove();
    if (!r.ok) { history.pop(); add("err", d.error || "Lỗi không rõ."); return; }
    history.push({ role: "assistant", content: d.reply });
    const used = d.usage ? ` · ${d.usage.total_tokens ?? "?"} token` : "";
    add("ai", d.reply || "(không có nội dung)", `${(d.ms / 1000).toFixed(1)} giây${used} · ${d.model || ""}`);
  } catch (err) {
    wait.remove(); history.pop(); add("err", "Lỗi mạng: " + err.message);
  } finally {
    $("send").disabled = false; $("q").focus();
  }
});

info();
</script>
</body>
</html>
